name: Build HashChat (Codeberg / Forgejo)

on:
  push:
    branches: [ main, codeberg-primary ]
  pull_request:
  workflow_dispatch:

jobs:
  # Required release path: Rust library + hashchat-tui + tests + audit.
  # Cabal/GHC are intentionally NOT installed or required here (INSTALL criterion 2).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies (Rust only — release path)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gcc make pkg-config libssl-dev

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain stable
          # shellcheck source=/dev/null
          source "$HOME/.cargo/env"
          echo "Using Cargo: $(cargo --version)"

      - name: Build and test Rust release path
        run: |
          # shellcheck source=/dev/null
          source "$HOME/.cargo/env"
          export PATH="$HOME/.cargo/bin:$PATH"

          echo "Cargo: $(cargo --version)"

          cargo build --release --locked
          mkdir -p rust-lib
          cp target/release/libhashchat_rust.so rust-lib/ || {
            echo "FATAL: libhashchat_rust.so missing after cargo build"
            exit 1
          }

          cargo build --release --locked --bin hashchat-tui --features tui
          test -x target/release/hashchat-tui

          cargo test --lib
          cargo test --release

          # Supply-chain: cargo-audit (blocking)
          set -e
          cargo install cargo-binstall --locked
          cargo binstall cargo-audit --locked -y
          cargo audit --deny warnings || {
            echo ""
            echo "!!! CRITICAL: cargo audit found security advisories !!!"
            echo "The build is failing because of this. Review the output above."
            exit 1
          }
          echo "cargo audit passed (no advisories)"
          set +e

        env:
          CARGO_TERM_COLOR: always

  # Optional / manual: transitional Cabal parity only. Never a required release check.
  # Trigger via workflow_dispatch or label; do not gate merges on this job.
  haskell-parity:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transitional Cabal parity (opt-in only)
        run: |
          echo "This job is manual/opt-in. Prefer: ./build.sh --haskell locally"
          echo "or: nix develop .#haskellDev"
          echo "See INSTALL.md § Transitional Haskell desktop."
          sudo apt-get update
          sudo apt-get install -y curl gcc make libgmp-dev zlib1g-dev libncurses-dev pkg-config libssl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain stable
          source "$HOME/.cargo/env"
          cargo build --release --locked
          mkdir -p rust-lib
          cp target/release/libhashchat_rust.so rust-lib/
          GHCUP_SHA256="480e05e414d2efa5abbda0006984a3343cd4973ead7b5c48d65a55a47b40ce59"
          mkdir -p "$HOME/.ghcup/bin"
          curl -sSL "https://downloads.haskell.org/~ghcup/$(uname -m)-linux-ghcup" -o /tmp/ghcup
          echo "$GHCUP_SHA256  /tmp/ghcup" | sha256sum -c --status
          install -m 755 /tmp/ghcup "$HOME/.ghcup/bin/ghcup"
          export PATH="$HOME/.ghcup/bin:$HOME/.cargo/bin:$PATH"
          ghcup install ghc 9.8.4 --set
          ghcup install cabal 3.10.3.0 --set
          cabal update
          cabal build -f-tui hashchat
          cabal build -f-tui hashchat-cli

  android-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Android build check (stub)
        run: |
          echo "Android build requires cargo-ndk + NDK. Skipping full build in CI for now."
          ls -la android/

name: Build HashChat (Codeberg / Forgejo)

on:
  push:
    branches: [ main, codeberg-primary ]
  pull_request:
  workflow_dispatch:

jobs:
  # Required release path: Rust library + hashchat-tui + tests + audit.
  # The Haskell tree was removed (INSTALL.md removal criteria 4+5, 2026-10-12).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies (Rust only — release path)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gcc make pkg-config libssl-dev ripgrep

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain stable
          # shellcheck source=/dev/null
          source "$HOME/.cargo/env"
          echo "Using Cargo: $(cargo --version)"

      - name: CI security gate (fail-closed, offline)
        run: |
          chmod +x scripts/ci-security-gate.sh
          ./scripts/ci-security-gate.sh

      - name: Build and test Rust release path
        run: |
          # shellcheck source=/dev/null
          source "$HOME/.cargo/env"
          export PATH="$HOME/.cargo/bin:$PATH"

          echo "Cargo: $(cargo --version)"

          cargo build --release --locked
          mkdir -p rust-lib
          cp target/release/libhashchat_rust.so rust-lib/ || {
            echo "FATAL: libhashchat_rust.so missing after cargo build"
            exit 1
          }

          cargo build --release --locked --bin hashchat-tui --features tui
          test -x target/release/hashchat-tui

          cargo test --lib
          cargo test --release

          # Supply-chain: cargo-audit (blocking). Known ratatui 0.29 transitive
          # informational advisories are ignored in .cargo/audit.toml (I-1);
          # --deny warnings still fails on any *new* warning or real vuln.
          set -e
          cargo install cargo-binstall --locked
          cargo binstall cargo-audit --locked -y
          cargo audit --deny warnings || {
            echo ""
            echo "!!! CRITICAL: cargo audit found security advisories !!!"
            echo "The build is failing because of this. Review the output above."
            echo "If this is a new ratatui-only informational warning, document it in .cargo/audit.toml."
            exit 1
          }
          echo "cargo audit passed (vulns denied; known ratatui warnings ignored via .cargo/audit.toml)"
          set +e

        env:
          CARGO_TERM_COLOR: always

  android-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Android build check (stub)
        run: |
          echo "Android build requires cargo-ndk + NDK. Skipping full build in CI for now."
          ls -la android/

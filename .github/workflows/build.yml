name: Build HashChat

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    # Only run on the main repo (not forks) for safety
    if: github.repository == 'ichbinlucasv/HashChat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache ghcup and cargo toolchains (supply chain + speed)
        uses: actions/cache@v4
        with:
          path: |
            ~/.ghcup
            ~/.cargo
          key: ${{ runner.os }}-ghcup-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ghcup-cargo-

      - name: Install dependencies (pinned GHC 9.8.4 + Rust - improved supply chain hygiene)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gcc make libgmp-dev zlib1g-dev libncurses-dev pkg-config

          # Supply chain hardened direct ghcup download with SHA256 verification.
          # This hash must be refreshed when we intentionally upgrade ghcup.
          # Current hash (x86_64-linux-ghcup) as of last verification.
          GHCUP_SHA256="480e05e414d2efa5abbda0006984a3343cd4973ead7b5c48d65a55a47b40ce59"

          mkdir -p "$HOME/.ghcup/bin"
          curl -sSL "https://downloads.haskell.org/~ghcup/$(uname -m)-linux-ghcup" -o /tmp/ghcup

          echo "$GHCUP_SHA256  /tmp/ghcup" | sha256sum -c --status || {
            echo "!!! ghcup binary checksum verification FAILED !!!"
            echo "This is a supply chain integrity failure. Aborting."
            exit 1
          }

          install -m 755 /tmp/ghcup "$HOME/.ghcup/bin/ghcup"
          export PATH="$HOME/.ghcup/bin:$PATH"

          ghcup install ghc 9.8.4 --set
          ghcup install cabal 3.10.3.0 --set

          # Rust - controlled user-local install
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
          source "$HOME/.cargo/env"

          echo "Using GHC: $(ghc --version)"
          echo "Using Cabal: $(cabal --version)"
      - name: Build everything safely
        run: |
          # Make sure our direct ghcup binary and cargo are in PATH
          export PATH="$HOME/.ghcup/bin:$HOME/.cargo/bin:$PATH"

          echo "GHC: $(ghc --version 2>/dev/null || echo 'not found')"
          echo "Cabal: $(cabal --version 2>/dev/null || echo 'not found')"
          echo "Cargo: $(cargo --version 2>/dev/null || echo 'not found')"

          # Rust core (always works, no system deps needed beyond what's in the runner)
          cargo build --release

          # Stage the Rust FFI library so Cabal finds it (extra-lib-dirs: rust-lib in the .cabal file).
          # Without this, `cabal build hashchat-cli` fails with "Missing C library: hashchat_rust".
          # CI resilience improvement (T3 paranoid): fail hard if the core Rust lib is missing.
          mkdir -p rust-lib
          cp target/release/libhashchat_rust.so rust-lib/ || { echo "FATAL: libhashchat_rust.so missing after cargo build"; exit 1; }

          # Haskell: update index first (critical)
          cabal update

          # Core library + CLI only — these have minimal deps and must always build.
          # We explicitly disable the 'tui' flag so Cabal never tries to resolve vty-unix / brick.
          cabal build -f-tui hashchat
          cabal build -f-tui hashchat-cli

          # TUI (Brick) build is optional in CI because it needs a much richer environment.
          # You can test it locally with: cabal build hashchat-tui
          echo "TUI build skipped in CI (use -f+tui locally with proper system deps)."

          # T3 paranoid CI note: Before any signed tag the committer MUST have run
          # ./scripts/pre-tag-check.sh --strict locally and created the local-run marker file.
          # This is currently a strong recommendation; will be turned into a blocking step post-v0.2.

          # Note: We no longer use Python. All builds are done with pure Bash + Cargo + Cabal.

          # Harden rec-12 (Expert): CI now FAILS if key paranoid tests regress.
          # Must cover: test_disappearing_wipe_integration, test_skipped_keys_and_wipe,
          # test_framing_and_mlock_safety_simulation, test_full_send_recv_roundtrip, etc.
          cargo test --release

          # Supply-chain (arch-3): Dependency audit (cargo-audit) - NOW BLOCKING ON HIGH/CRITICAL
          # From a paranoid perspective, non-blocking audit is security theater.
          # We now fail the build on high or critical advisories.
          # Informational/warning-level issues are allowed for the v0.2-preview phase but must be
          # manually reviewed and noted before any signed tag (see RELEASE_PROCESS.md).
          cargo install cargo-audit --locked 2>/dev/null || true
          if ! cargo audit --deny high; then
            echo ""
            echo "!!! CRITICAL: cargo audit found HIGH or CRITICAL security advisories !!!"
            echo "The build is failing because of this. Review the output above."
            echo "For v0.2 we are still allowing some lower-severity noise, but high/critical must be addressed or explicitly accepted."
            exit 1
          fi
          echo "cargo audit passed (no high or critical advisories)"
        env:
          CARGO_TERM_COLOR: always

  android-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Android build check (stub)
        run: |
          echo "Android build requires cargo-ndk + NDK. Skipping full build in CI for now."
          ls -la android/
name: Build HashChat

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    # Only run on the main repo (not forks) for safety
    if: github.repository == 'ichbinlucasv/HashChat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghc cabal-install rustc cargo libncurses-dev
      - name: Build everything safely
        run: |
          cargo build --release
          cabal build hashchat-desktop
          cabal build hashchat-cli
          python3 build.py
        env:
          CARGO_TERM_COLOR: always

  android-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Android build check (stub)
        run: |
          echo "Android build requires cargo-ndk + NDK. Skipping full build in CI for now."
          ls -la android/
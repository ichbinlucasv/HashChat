name: Build HashChat

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    # Only run on the main repo (not forks) for safety
    if: github.repository == 'ichbinlucasv/HashChat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (pinned GHC via ghcup for reproducibility)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gcc make libgmp-dev zlib1g-dev libncurses-dev pkg-config

          # Install a known stable GHC (9.8.4) instead of whatever apt gives (which can be 9.14+ and break layout)
          curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | sh -s -- -y
          source "$HOME/.ghcup/env"
          ghcup install ghc 9.8.4
          ghcup set ghc 9.8.4
          ghcup install cabal 3.10.3.0 || true
          ghcup set cabal 3.10.3.0

          # Rust
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"

          echo "Using GHC: $(ghc --version)"
          echo "Using Cabal: $(cabal --version)"
      - name: Build everything safely
        run: |
          source "$HOME/.ghcup/env" || true
          source "$HOME/.cargo/env" || true

          # Rust core (always works, no system deps needed beyond what's in the runner)
          cargo build --release

          # Haskell: update index first (critical)
          cabal update

          # Core library + CLI only — these have minimal deps and must always build.
          # We explicitly disable the 'tui' flag so Cabal never tries to resolve vty-unix / brick.
          cabal build -f-tui hashchat
          cabal build -f-tui hashchat-cli

          # TUI (Brick) build is optional in CI because it needs a much richer environment.
          # You can test it locally with: cabal build hashchat-tui
          echo "TUI build skipped in CI (use -f+tui locally with proper system deps)."

          # Note: We no longer use Python. All builds are done with pure Bash + Cargo + Cabal.

          # Harden rec-12 (Expert): CI now FAILS if key paranoid tests regress.
          # Must cover: test_disappearing_wipe_integration, test_skipped_keys_and_wipe,
          # test_framing_and_mlock_safety_simulation, test_full_send_recv_roundtrip, etc.
          cargo test --release

          # Supply-chain (arch-3): Dependency audit (cargo-audit).
          # Not yet failing the build (many dev-only advisories in Haskell/Rust ecosystem),
          # but must be run manually before signed v0.2 tag and any real release.
          # TODO: Promote to `|| true` removal + SBOM generation (e.g. cargo sbom) for production.
          cargo install cargo-audit 2>/dev/null || echo "cargo-audit not installed in this env"
          cargo audit || echo "Audit completed with warnings or skipped (run locally with 'cargo install cargo-audit && cargo audit' before tagging)"
        env:
          CARGO_TERM_COLOR: always

  android-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Android build check (stub)
        run: |
          echo "Android build requires cargo-ndk + NDK. Skipping full build in CI for now."
          ls -la android/
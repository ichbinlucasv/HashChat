[package]
name = "hashchat-tauri"
version = "0.1.0"
edition = "2021"

# Phase3: Minimal sandboxed GUI wrapper (optional, TUI remains ultra-secure default).
# Strict capabilities: no direct net/fs; all via our Rust FFI (crypto, transport, ratchet, Extreme).
# See ROADMAP Sec5: "Optional minimal sandboxed GUI (Tauri strict — no surface increase). Consistent parity..."
# Build: cargo tauri or from nix later. Desktop always free; Android separate.

[dependencies]
# Phase3 High 'full Tauri app': depend on hashchat-rust for FFI (ratchet, relay, quantum, Starlink, channels, Extreme).
# tauri = { version = "1", features = ["api-all"] } but strict: no api-all, only custom invoke for FFI.
# JS thin calls Rust for all sensitive (same as TUI/Android).
tauri = { version = "1", features = ["api-all"] }  # tighten in prod to custom only
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# quantum passthrough.
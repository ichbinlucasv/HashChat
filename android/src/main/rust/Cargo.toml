[package]
name = "hashchat-android"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Full paranoid Double Ratchet for Android (high-4).
# These match the root hashchat-rust crate for behavioral parity between desktop and phone.
# Any dep change here MUST be mirrored in the root Cargo.toml and vice-versa.
ring = "0.17"
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.8"
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2.1"  # for LongTermIdentity (ed25519 signing + x25519) - Critical ContactAddress item
jni = "0.21"   # For proper JNI glue to Kotlin MainActivity + HashChatKeystore
argon2 = "0.5" # Real KDF for ratchet export envelope (high-4 / crit-2 OPSEC)

# OPSEC-critical (mirrored from root crate): Constant-time comparison.
# Replaces deprecated internal ring API. subtle is the recommended audited primitive.
subtle = "2.6"
# Note: no Python, no gi-gtk, pure Rust + Haskell as per project rules.
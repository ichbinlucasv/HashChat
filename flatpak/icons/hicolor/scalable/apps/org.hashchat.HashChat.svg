<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Solid black background (#000000 per project theme) -->
  <rect width="128" height="128" rx="22" fill="#000000"/>
  
  <!-- Strong gold security border (#FFD700) -->
  <rect x="3" y="3" width="122" height="122" rx="19" fill="none" stroke="#FFD700" stroke-width="4"/>
  
  <!-- Subtle inner gold ring (depth) -->
  <rect x="10" y="10" width="108" height="108" rx="14" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.22"/>
  
  <!-- Simple lock icon (shackle + body) in gold - signals maximum security / OPSEC -->
  <!-- Shackle -->
  <path d="M 46 42 Q 46 32 54 32 Q 62 32 62 42" fill="none" stroke="#FFD700" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Lock body -->
  <rect x="40" y="48" width="28" height="26" rx="3" fill="#FFD700"/>
  <!-- Keyhole -->
  <circle cx="54" cy="56" r="4" fill="#000000"/>
  <rect x="52.5" y="58" width="3" height="8" fill="#000000"/>
  
  <!-- HC monogram below lock (small, clean) -->
  <text 
    x="64" 
    y="100" 
    font-family="monospace" 
    font-size="22" 
    font-weight="bold" 
    fill="#FFD700" 
    text-anchor="middle" 
    letter-spacing="3">HC</text>
  
  <!-- Very subtle bottom security line -->
  <line x1="30" y1="112" x2="98" y2="112" stroke="#FFD700" stroke-width="1" opacity="0.35"/>
</svg>

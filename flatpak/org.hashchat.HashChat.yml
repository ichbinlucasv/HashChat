app-id: org.hashchat.HashChat
runtime: org.freedesktop.Platform
runtime-version: "24.08"   # Updated to current stable (hardening)
sdk: org.freedesktop.Sdk
command: hashchat-tui

finish-args:
  # === Maximum paranoid permissions for a Tor-only messenger ===
  - --share=network                    # Only for Tor hidden services (no direct clearnet)
  - --socket=wayland
  - --socket=x11
  - --device=dri                       # GPU acceleration only
  - --filesystem=home                  # Only to store encrypted data in ~/hashchat_data
  - --env=LD_LIBRARY_PATH=/app/lib
  - --talk-name=org.freedesktop.secrets   # Future: hardware-backed keys (can be removed if not used)
  # Aggressive hardening
  - --no-legacy
  - --socket=session-bus
  - --unset-env=DBUS_SESSION_BUS_ADDRESS
  - --unset-env=DISPLAY
  - --unset-env=WAYLAND_DISPLAY
  - --unset-env=XDG_RUNTIME_DIR
  - --unset-env=SESSION_MANAGER
  # Future work
  # - --seccomp=seccomp-extra.json     # Custom strict syscall filter
  # Icons (Critical for v0.2)
  # TODO: Add real high-quality 64/128/256/512 PNG + final SVG before any public distribution or Flathub.
  # Current improved placeholder (lock in black+gold) is in icons/hicolor/scalable. See ICONS.md for pipeline.

# Note: We intentionally do not set broad build-options like no-network here anymore,
# because the Nix-driven path already builds everything outside the Flatpak sandbox.
# The manifest is now purely an "install prebuilts" manifest.

modules:
  # === Pure install-only manifest (no app code is built inside Flatpak) ===
  # The ONLY supported/reproducible way to build this Flatpak is via:
  #   nix build .#hashchat-flatpak
  # All binaries are pre-built by the flake for maximum reliability.
  - name: hashchat-prebuilts
    buildsystem: simple
    build-commands:
      # Install Rust library (prefer .so)
      - |
        if [ -f prebuilt/libhashchat_rust.so ]; then
          install -Dm755 prebuilt/libhashchat_rust.so /app/lib/libhashchat_rust.so
        elif [ -f prebuilt/libhashchat_rust.a ]; then
          install -Dm755 prebuilt/libhashchat_rust.a /app/lib/libhashchat_rust.a
        else
          echo "ERROR: prebuilt Rust library not found. Build via Nix flake only." >&2
          exit 1
        fi

      # Install TUI binary
      - |
        if [ -f prebuilt/hashchat-tui ]; then
          install -Dm755 prebuilt/hashchat-tui /app/bin/hashchat-tui
        else
          echo "ERROR: prebuilt hashchat-tui not found. Build via Nix flake only." >&2
          exit 1
        fi
    sources:
      - type: dir
        path: .
      # The prebuilt/ directory is populated by the Nix flake before flatpak-builder runs.

  - name: desktop-file
    buildsystem: simple
    build-commands:
      - install -Dm644 flatpak/org.hashchat.HashChat.desktop /app/share/applications/org.hashchat.HashChat.desktop
      - install -Dm644 flatpak/org.hashchat.HashChat.metainfo.xml /app/share/metainfo/org.hashchat.HashChat.metainfo.xml
      # Install scalable icon (primary, vector, correct for all sizes)
      - install -Dm644 flatpak/icons/hicolor/scalable/apps/org.hashchat.HashChat.svg \
          /app/share/icons/hicolor/scalable/apps/org.hashchat.HashChat.svg

      # RASTER ICONS (Critical v0.2 / Flathub blocking item)
      # TODO: Generate real 64/128/256/512 PNGs from the improved SVG using rsvg-convert / ImageMagick / Inkscape
      # (see flatpak/ICONS.md for exact commands). Then replace the loop below with proper PNG installs.
      # Current: Only scalable is installed. No silent fallbacks or || true allowed (fail-hard OPSEC).
      # The loop below is intentionally a no-op placeholder that will be replaced when real PNGs exist.
      - |
        # Real PNGs must be added here before Flathub. See ICONS.md.
        # Example (once PNGs exist):
        # for size in 64 128 256 512; do
        #   install -Dm644 flatpak/icons/hicolor/${size}x${size}/apps/org.hashchat.HashChat.png \
        #     /app/share/icons/hicolor/${size}x${size}/apps/org.hashchat.HashChat.png
        # done
        echo "Icon rasters not yet present (see ICONS.md) - only scalable vector installed."
    sources:
      - type: dir
        path: .

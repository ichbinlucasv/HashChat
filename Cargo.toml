[package]
name = "hashchat-rust"
version = "0.1.9"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]
path = "src/rust/lib.rs"

[dependencies]
ring = "0.17"
zeroize = { version = "1.7", features = ["derive"] }
ed25519-dalek = "2.1"
rand = "0.8"
getrandom = "0.2"
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
argon2 = "0.5"
libc = "0.2"   # for mlockall / seccomp primitives on Linux (used under cfg(target_os="linux"))

# OPSEC-critical: Constant-time comparison primitive.
# Replaces deprecated ring::constant_time::verify_slices_are_equal (internal API, no side-channel promises).
# subtle is the standard, audited crate used across the Rust crypto ecosystem (dalek, RustCrypto, etc.).
# It is tiny, has no extra runtime deps in recent versions, and makes security intent explicit for auditors.
subtle = "2.6"

# Gated PQ (quantum feature). See quantum.rs for requirements + warnings.
ml-kem = { version = "0.3", features = ["zeroize"], optional = true }
# JNI only when building the Android cdylib. Desktop never pulls this in.
jni = { version = "0.21", optional = true }

[features]
default = []
# One crate for desktop FFI + Android JNI. Build the phone .so with:
#   cargo ndk -t arm64-v8a -o android/src/main/jniLibs build --release --features android
android = ["dep:jni"]
# long-13 / High Phase3 (deepened "work on all critial and hight risk now no stop"): optional gated.
# --features quantum: hybrid_kex now does REAL X25519 + REAL ML-KEM (ml-kem crate with zeroize).
# Hybrid (X25519 || ML-KEM-768). Gated. Extreme refuses PQ surface.
# IMPORTANT: ml-kem crate (as of 2026) has zeroize support but "has never been independently audited".
# Prefer libcrux (Cryspen verified with hax/F*) for higher assurance in future.
# Classical Double Ratchet is always default and safe. Use only if you accept the risk.
quantum = ["dep:ml-kem"]